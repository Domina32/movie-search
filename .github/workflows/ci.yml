# CI — full test suite on every push and pull request.
#
# Split of responsibilities (same as hajduk-detector):
# - pre-commit (local): ruff check, ruff format, mypy, private-key check.
# - CI (here): pytest only. Lint/type checks are NOT repeated in CI so
#   the pipeline stays fast and has one job: "do the tests pass?".
#
# Every action is pinned to a full commit SHA (not a moving tag like @v4).
# Dependabot (see ../dependabot.yml) bumps these pins weekly; CI on the
# bump PR proves the new version works before it lands.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest
