# CI — full test suite on every push and pull request.
#
# Split of responsibilities (same as hajduk-detector):
# - pre-commit (local): ruff check, ruff format, mypy, private-key check.
# - CI (here): pytest only. Lint/type checks are NOT repeated in CI so
#   the pipeline stays fast and has one job: "do the tests pass?".
#
# Every action is pinned to a full commit SHA (not a moving tag like @v4).
# Dependabot (see ../dependabot.yml) bumps these pins weekly; CI on the
# bump PR proves the new version works before it lands.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A new push to the same ref cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Install dependencies
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run pytest
