[project]
name = "movie-search"
version = "0.1.0"
description = "Semantic movie search"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = []

[dependency-groups]
dev = [
    "pyrefly>=0.40.0,<1.0.0",
    "pytest>=8.0.0,<9.0.0",
    "ruff>=0.2.2,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/movie_search"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports/vars)
    "I",   # isort (import sorting/control)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused function arguments
    "T201",   # print() not allowed
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
