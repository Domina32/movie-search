[project]
name = "movie-search"
version = "0.1.0"
description = "Semantic movie search"
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic==1.20.0",
    "chromadb==1.5.9",
    "fastapi==0.143.2",
    "httpx==0.28.1",
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.0",
    "pydantic-settings==2.16.0",
    "python-dotenv==1.2.4",
    "sqlalchemy[asyncio]==2.1.4",
    "sqlmodel==0.0.48",
    "uvicorn[standard]==0.54.0",
    "sentence-transformers==6.1.0",
]

[dependency-groups]
dev = [
    "hypothesis==6.169.4",
    "pyrefly==1.3.2",
    "pytest==8.4.2",
    "ruff==0.17.0",
    "pytest-asyncio==1.4.0",
    "aiosqlite==0.22.1",
    "pyinstrument==5.1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/db", "src/ingest", "src/search", "src/api"]
# NOTE: src/config.py is a top-level module, not a package, so the wheel
# build needs a follow-up (force-include) for publishing. Dev/test/run
# use PYTHONPATH=src / pytest pythonpath below, unaffected.

[tool.pyrefly]
preset = "strict"

[tool.ruff]
target-version = "py314"
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes (unused imports/vars)
    "I",   # isort (import sorting/control)
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused function arguments
    "T201",   # print() not allowed
]
ignore = [
    "E501", # line too long (formatter handles it)
]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "strict"
markers = ["hypothesis: property-based tests (Hypothesis, slower)"]
