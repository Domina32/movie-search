name: movie-search

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: movie_search
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"

  chroma:
    image: ghcr.io/chroma-core/chroma:1.5.9
    volumes:
      - chroma-data:/data
    ports:
      - "8002:8000"
    healthcheck:
      test: ["CMD-SHELL", "cat /proc/net/tcp | grep -q '00000000:1F40'"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 90s

  app:
    build:
      context: .
      args:
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      HF_HUB_OFFLINE: 0
      HF_HOME: ${HF_HOME:-/root/.cache/huggingface}
      PROFILING_ENABLED: ${PROFILING_ENABLED:-false}
    volumes:
      - hf-cache:/root/.cache/huggingface
    ports:
      - "8001:8001"
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8001/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s

  ingest:
    build:
      context: .
      args:
        EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
    profiles: ["ingest"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      CHROMA_HOST: chroma
      CHROMA_PORT: 8000
      EMBED_MODEL: ${EMBED_MODEL:-BAAI/bge-small-en-v1.5}
      HF_HUB_OFFLINE: 0
      HF_HOME: ${HF_HOME:-/root/.cache/huggingface}
      MAX_PAGES: ${MAX_PAGES}
    volumes:
      - hf-cache:/root/.cache/huggingface
    depends_on:
      db:
        condition: service_healthy
      chroma:
        condition: service_healthy
      app:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "python", "-m", "ingest.runner"]

volumes:
  pgdata:
  chroma-data:
  hf-cache:
